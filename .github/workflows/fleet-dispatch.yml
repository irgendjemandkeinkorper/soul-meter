# Generated by @google/jules-fleet init
# https://github.com/google-labs-code/jules-sdk

name: Fleet Dispatch

on:
  schedule:
    - cron: '0 3-23/6 * * *'
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Milestone ID to dispatch (leave empty to dispatch all)'
        type: string
        required: false

concurrency:
  group: fleet-dispatch
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      milestones: ${{ steps.list.outputs.milestones }}
    steps:
      - name: Resolve milestones
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MILESTONE: ${{ inputs.milestone }}
        run: |
          if [ -n "$INPUT_MILESTONE" ]; then
            echo "milestones=[\"$INPUT_MILESTONE\"]" >> "$GITHUB_OUTPUT"
          else
            milestones=$(gh api repos/${{ github.repository }}/milestones --jq '[.[].number | tostring]')
            echo "milestones=$milestones" >> "$GITHUB_OUTPUT"
          fi

  dispatch:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        milestone: ${{ fromJSON(needs.discover.outputs.milestones) }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skip milestone with an open in-flight PR
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_prs=$(gh api --paginate --slurp \
            "repos/${{ github.repository }}/pulls?state=open&per_page=100" \
            --jq 'add | map(select(.milestone != null and .milestone.number == '${{ matrix.milestone }}')) | length')
          if [ "$open_prs" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Milestone ${{ matrix.milestone }} already has $open_prs open PR(s); skipping duplicate dispatch."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch milestone
        if: steps.guard.outputs.skip != 'true'
        run: npx -y --package=@google/jules-fleet@0.0.1-experimental.35 jules-fleet dispatch --milestone ${{ matrix.milestone }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          FLEET_APP_ID: ${{ secrets.FLEET_APP_ID }}
          FLEET_APP_PRIVATE_KEY_BASE64: ${{ secrets.FLEET_APP_PRIVATE_KEY_BASE64 }}
          FLEET_APP_INSTALLATION_ID: ${{ secrets.FLEET_APP_INSTALLATION_ID }}
