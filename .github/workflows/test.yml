name: Godot tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.1-stable
      GODOT_BIN: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4

      # Runs before Godot is even installed: pure Python, no engine, fast fail.
      # `[if expr]` without the trailing slash silently no-ops, so a dead
      # consequence check is otherwise indistinguishable from a working one.
      - name: Lint dialogue response conditions
        run: |
          python3 tools/lint_dialogue_conditions.py --self-test
          bash scripts/check_dialogue_conditions.sh

      - name: Cache Godot engine
        uses: actions/cache@v4
        with:
          path: /tmp/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-engine

      - name: Install Godot and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xvfb
          if [ ! -x "$GODOT_BIN" ]; then
            wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O /tmp/godot.zip
            unzip -q /tmp/godot.zip -d /tmp/godot
            chmod +x "$GODOT_BIN"
          fi

      - name: Import project
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path . --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -En 'SCRIPT ERROR: (Parse|Compile) Error|ERROR: Failed to load script' /tmp/godot-import.log; then
            echo "Godot reported a script parse/compile failure during import."
            exit 1
          fi

      - name: Check art-free acceptance artifacts
        run: SOUL_METER_ACCEPTANCE_ARTIFACTS_ONLY=1 GODOT_BIN="$GODOT_BIN" bash scripts/acceptance_gate.sh

      - name: Check Pandora/generated-data drift
        run: SOUL_METER_DRIFT_CHECK=1 GODOT_BIN="$GODOT_BIN" bash scripts/check_generated_data.sh

      - name: Run gdUnit4 headless suite
        run: SOUL_METER_HEADLESS=1 GODOT_BIN="$GODOT_BIN" bash scripts/test.sh -a test

      - name: Summarize gdUnit4 results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          reports = sorted(glob.glob("reports/**/results.xml", recursive=True))
          if not reports:
              print("gdUnit4: no JUnit XML report was generated")
              raise SystemExit(0)

          root = ET.parse(reports[-1]).getroot()
          summary = (
              f"gdUnit4: {root.get('tests', '0')} tests, "
              f"{root.get('failures', '0')} failures, "
              f"{root.get('errors', '0')} errors, "
              f"{root.get('skipped', '0')} skipped"
          )
          print(summary)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary_file:
                  summary_file.write(f"### gdUnit4\n\n{summary}\n")
          PY

      - name: Upload gdUnit4 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit4-reports
          path: reports/
          if-no-files-found: warn

  package-windows:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.1-stable
      GODOT_TEMPLATE_DIR: 4.7.1.stable
      GODOT_BIN: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot engine
        uses: actions/cache@v4
        with:
          path: /tmp/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-engine

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-templates-${{ env.GODOT_TEMPLATE_DIR }}

      - name: Install Godot, export templates, and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip
          if [ ! -x "$GODOT_BIN" ]; then
            wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O /tmp/godot.zip
            unzip -q /tmp/godot.zip -d /tmp/godot
            chmod +x "$GODOT_BIN"
          fi
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          if [ ! -f "$template_dir/windows_release.x86_64" ]; then
            wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -O /tmp/templates.tpz
            unzip -q /tmp/templates.tpz -d /tmp/godot-templates
            mkdir -p "$template_dir"
            cp /tmp/godot-templates/templates/* "$template_dir/"
          fi

      - name: Import and export Windows x64
        run: |
          "$GODOT_BIN" --headless --path . --import --quit
          mkdir -p dist/SoulMeter
          # Pandora's upstream release hook ASCII-compresses its JSON and drops Unicode lore.
          # Recovery mode skips editor-only hooks; the preset explicitly includes raw data.pandora.
          "$GODOT_BIN" --headless --recovery-mode --path . --export-release "Windows Desktop" dist/SoulMeter/SoulMeter.exe
          cp README.md DEPENDENCIES.md dist/SoulMeter/
          cd dist
          zip -r SoulMeter-windows-x86_64.zip SoulMeter

      - name: Upload Windows playtest build
        uses: actions/upload-artifact@v4
        with:
          name: SoulMeter-windows-x86_64
          path: dist/SoulMeter-windows-x86_64.zip
          if-no-files-found: error
