name: Forge Nightly Replay

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  forge-nightly-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.1-stable
      GODOT_BIN: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot engine
        uses: actions/cache@v4
        with:
          path: /tmp/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-engine

      - name: Install Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          if [ ! -x "$GODOT_BIN" ]; then
            wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O /tmp/godot.zip
            unzip -q /tmp/godot.zip -d /tmp/godot
            chmod +x "$GODOT_BIN"
          fi

      - name: Import project
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path . --import --quit 2>&1 | tee /tmp/godot-import-first.log || true
          "$GODOT_BIN" --headless --path . --import --quit 2>&1 | tee /tmp/godot-import-second.log
          if grep -En 'SCRIPT ERROR: (Parse|Compile) Error|ERROR: Failed to load script' /tmp/godot-import-second.log; then
            echo "Godot reported a script parse/compile failure during import."
            exit 1
          fi

      - name: Apply committed fixture package
        run: |
          if [ -f "addons/dramgid_forge/tools/forge.gd" ]; then
            "$GODOT_BIN" --headless -s addons/dramgid_forge/tools/forge.gd apply
          else
            echo "addons/dramgid_forge/tools/forge.gd not present yet, skipping Forge apply."
          fi

      - name: Bake committed fixture package with --write
        run: |
          if [ -f "addons/dramgid_forge/tools/forge.gd" ]; then
            "$GODOT_BIN" --headless -s addons/dramgid_forge/tools/forge.gd bake --write
          else
            echo "addons/dramgid_forge/tools/forge.gd not present yet, skipping Forge bake."
          fi

      - name: Check git status after replay
        run: |
          git status
